[project]
name = "bia-harness"
version = "0.1.0"
description = "Path-3 hybrid harness for modded-nanogpt Track-3 optimization speedrun (policy md + Harbor task + runner)."
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
# legacy/harness2/tests exists and passes, but is excluded on purpose: it guards
# the planner path that agentloop does not use. Cover it with an explicit
# `python -m pytest legacy/harness2/tests`.
testpaths = ["tests"]
norecursedirs = [
    "records",
    "legacy/harness1",
    ".pytest_cache",
    "runs",
    "policy/scratchpad",
    "tasks/nanogpt-speedrun/environment",
]
addopts = "-q"
