[project]
name = "bia-harness"
version = "0.1.0"
description = "Path-3 hybrid harness for modded-nanogpt Track-3 optimization speedrun (policy md + Harbor task + runner)."
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
# The suite is BOTH trees: the new pipeline under tests/, and the legacy
# planner substrate that moved to legacy/harness2/tests/ alongside its modules.
# Run the full suite with a bare `python -m pytest` (no path argument), which is
# what picks up testpaths. `pytest tests/` now collects the new-pipeline half only.
testpaths = ["tests", "legacy/harness2/tests"]
norecursedirs = [
    "records",
    "legacy/harness1",
    ".pytest_cache",
    "runs",
    "policy/scratchpad",
    "tasks/nanogpt-speedrun/environment",
]
addopts = "-q"
